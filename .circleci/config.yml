version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "pyproject.toml" }}
            - pip-v1-
      - run:
          name: Install dependencies
          command: pip install -e ".[dev]"
      - save_cache:
          key: pip-v1-{{ checksum "pyproject.toml" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Run tests
          command: pytest --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

workflows:
  test:
    jobs:
      - test
