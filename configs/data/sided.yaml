# SIDED dataset configuration
name: sided

# Data location
data_dir: ~/.cache/edge-pipeline/sided

# Window configuration
window_size: 288  # 1 hour at 1-minute resolution
stride: 5

# Batch size
batch_size: 128
num_workers: 2

# Facility splits. These use the canonical SIDED file names from Hugging Face.
train_facilities:
  - Dealer_LA
  - Dealer_Offenbach
  - Dealer_Tokyo
  - Logistic_LA
  - Logistic_Offenbach
  - Logistic_Tokyo

val_facilities:
  - Office_LA

test_facilities:
  - Office_Offenbach
  - Office_Tokyo

# Preprocessing
use_robust_scaling: true
strict_site_ids: true

# Augmentation
use_amda: true
amda_scale: 2.5
