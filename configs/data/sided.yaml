# SIDED dataset configuration
name: sided

# Data location
data_dir: ~/.cache/edge-pipeline/sided

# Window configuration
window_size: 288  # 1 hour at 1-minute resolution
stride: 5

# Batch size
batch_size: 128
num_workers: 2

# Facility splits. Keep training balanced across site type and location,
# and cover all three site types across validation + test.
train_facilities:
  - Dealer_LA
  - Dealer_Offenbach
  - Logistic_LA
  - Logistic_Tokyo
  - Office_Offenbach
  - Office_Tokyo

val_facilities:
  - Dealer_Tokyo

test_facilities:
  - Logistic_Offenbach
  - Office_LA

# Preprocessing
use_robust_scaling: true
strict_site_ids: true

# Augmentation
# use_amda: true
# amda_scale: 2.5
